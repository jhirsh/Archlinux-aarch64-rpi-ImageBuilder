# Apple keyboards route F1-F12 through hid_apple as media keys by default, and
# most have no fn key to reach the real F-key. That makes Ctrl+Alt+F2 dead at
# the console, which is the one place a bare image needs it. fnmode=2 makes
# the top row plain F-keys. Only hid_apple reads this; other keyboards are
# untouched.
options hid_apple fnmode=2
