name: Build Archlinux aarch64 Raspberry Pi Image

on:
  workflow_dispatch:
    inputs:
      rpi_model:
        description: 'Raspberry Pi Model (4 or 5)'
        required: true
        default: '5'
        type: choice
        options:
          - '4'
          - '5'
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RPI_MODEL: ${{ inputs.rpi_model || '5' }}
  IMAGE_NAME_PREFIX: archlinux-rpi
  # UTC. Where the card will be used is the flasher's business, not the
  # builder's, and it is one command after login: timedatectl set-timezone.
  OS_TIMEZONE: UTC
  # Deliberately unset, and it should stay that way while this repository is
  # public. A key baked in here is a key that every person who flashes the
  # published image grants root to -- whoever ran the build. Upstream's images
  # authorize its maintainers for exactly this reason, and doing the same with
  # a different name on it would be no better.
  #
  # install-authorized-keys-from-boot reads authorized_keys off the card's
  # boot partition on first boot instead, so whoever writes the card is the
  # only one who gets in. Set SSH_PUB_KEY_URLS only for a private build of an
  # image nobody else will flash.
  SSH_PUB_KEY_URLS: ""
  # WIFI_SSID, WIFI_PASSWORD and ZT_NETWORK_ID are deliberately not passed
  # in. A WiFi PSK would be written in the clear into a downloadable image,
  # and a ZeroTier ID would have every stranger's Pi trying to join that
  # network on first boot. build.sh still honours them for a private build.

jobs:
  build-image:
    name: Build and Upload Raspberry Pi Image
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install build dependencies
      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            qemu-user-static-binfmt qemu-user-static \
            dosfstools wget libarchive arch-install-scripts \
            parted tree fping git zstd github-cli

      # Build the image using build.sh script
      - name: Build Raspberry Pi Image
        env:
          RPI_MODEL: ${{ env.RPI_MODEL }}
          IMAGE_NAME_PREFIX: ${{ env.IMAGE_NAME_PREFIX }}
          OS_TIMEZONE: ${{ env.OS_TIMEZONE }}
          SSH_PUB_KEY_URLS: ${{ env.SSH_PUB_KEY_URLS }}
        run: |
          chmod +x ./build.sh
          ./build.sh --rpi-model ${{ env.RPI_MODEL }}

      # Find the generated image
      - name: Find Generated Image
        id: find_image
        run: |
          # Search in both current directory (new default) and /tmp (fallback)
          IMAGE_FILE=$(find . /tmp -maxdepth 2 -name "rpi-build.*" -type d -exec find {} -name "*.img.zst" \; 2>/dev/null | head -1)
          if [ -z "$IMAGE_FILE" ]; then
            echo "ERROR: No compressed image found!"
            echo "Searched in: $(pwd) and /tmp"
            ls -la $(pwd)/rpi-build.* 2>/dev/null || echo "No rpi-build dirs in $(pwd)"
            ls -la /tmp/rpi-build.* 2>/dev/null || echo "No rpi-build dirs in /tmp"
            exit 1
          fi
          echo "IMAGE_FILE=$IMAGE_FILE" >> $GITHUB_ENV
          echo "IMAGE_NAME=$(basename $IMAGE_FILE)" >> $GITHUB_ENV
          echo "Found image: $IMAGE_FILE"

          # No password is discovered, logged or uploaded any more: the image
          # ships with every account locked and one is set per card, on the
          # first boot, from a file on the boot partition.

      # Upload compressed image as artifact
      - name: Upload Compressed Image as Artifact
        if: always() && env.IMAGE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: ${{ env.IMAGE_FILE }}
          retention-days: 90
          compression-level: 0

      # Publish the image where it can be flashed without unwrapping it first.
      #
      # Every workflow artifact is served inside a zip GitHub adds itself, so
      # downloading one gives a zip of a .img.zst: two layers to strip before
      # any imager will look at it. A release asset is served as the file it
      # is, on a stable URL, so the image goes straight into Raspberry Pi
      # Imager (which reads zstd) or one `unzstd` away from anything else.
      #
      # The tag is rolling rather than per-commit: the useful question is
      # "what is the current image for this model", and /releases/latest/
      # answers it without looking anything up.
      #
      # Nothing published here is a credential: the image carries no password
      # and no SSH key at all.
      - name: Publish the image as a release asset
        if: env.IMAGE_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -R every time: the checkout in this git-less container falls back
          # to a REST download with no .git, so gh cannot infer the repository.
          tag="rpi${RPI_MODEL}-latest"
          notes="Flash the .img.zst with Raspberry Pi Imager, or pipe it through zstdcat to dd. The image contains no credentials at all, so provision the card before booting it: with the card still mounted, run ./provision.sh from this repository to write your SSH key and WiFi to its boot partition, or copy the files by hand (authorized_keys, wifi, rootpw). Root logs in over SSH by key on port 22, password authentication is off, and the Pi answers to <hostname>.local. The root filesystem expands to fill the card on first boot."
          gh release edit -R "$GITHUB_REPOSITORY" "$tag" --notes "$notes" 2>/dev/null ||
            gh release create -R "$GITHUB_REPOSITORY" "$tag" \
              --title "Arch Linux ARM for Raspberry Pi $RPI_MODEL" --notes "$notes"
          # A rolling tag holds one image. Drop whatever the last build left.
          for old in $(gh release view -R "$GITHUB_REPOSITORY" "$tag" --json assets -q '.assets[].name'); do
            gh release delete-asset -R "$GITHUB_REPOSITORY" "$tag" "$old" -y
          done
          gh release upload -R "$GITHUB_REPOSITORY" "$tag" "$IMAGE_FILE" --clobber
          echo "Flashable image: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$IMAGE_NAME"

      # Print summary
      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Build Summary"
          echo "=========================================="
          echo "Raspberry Pi Model: ${{ env.RPI_MODEL }}"
          echo "Image Name: ${{ env.IMAGE_NAME }}"
          echo "Accounts: locked; set one via rootpw on the boot partition."
          echo "=========================================="

