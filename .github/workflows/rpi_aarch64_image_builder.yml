name: Build Archlinux aarch64 Raspberry Pi Image

on:
  workflow_dispatch:
    inputs:
      rpi_model:
        description: 'Raspberry Pi Model (4 or 5)'
        required: true
        default: '5'
        type: choice
        options:
          - '4'
          - '5'
      upload_to_s3:
        description: 'Upload to S3'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RPI_MODEL: ${{ inputs.rpi_model || '5' }}
  IMAGE_NAME_PREFIX: archlinux-rpi
  OS_TIMEZONE: Europe/Paris
  # Whoever is listed here gets root over SSH on every machine flashed with
  # the result. Upstream lists its own maintainers; a fork that leaves that
  # alone is handing root on its Pi to two strangers.
  SSH_PUB_KEY_URLS: https://github.com/jhirsh.keys
  # Optional: Override via repository variables or secrets
  WIFI_SSID: ${{ secrets.WIFI_SSID }}
  WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
  ZT_NETWORK_ID: ${{ secrets.ZT_NETWORK_ID }}

jobs:
  build-image:
    name: Build and Upload Raspberry Pi Image
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install build dependencies
      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            qemu-user-static-binfmt qemu-user-static \
            dosfstools wget libarchive arch-install-scripts \
            parted tree fping pwgen git s3cmd zstd github-cli

      # Build the image using build.sh script
      - name: Build Raspberry Pi Image
        env:
          RPI_MODEL: ${{ env.RPI_MODEL }}
          IMAGE_NAME_PREFIX: ${{ env.IMAGE_NAME_PREFIX }}
          OS_TIMEZONE: ${{ env.OS_TIMEZONE }}
          SSH_PUB_KEY_URLS: ${{ env.SSH_PUB_KEY_URLS }}
          WIFI_SSID: ${{ env.WIFI_SSID }}
          WIFI_PASSWORD: ${{ env.WIFI_PASSWORD }}
          ZT_NETWORK_ID: ${{ env.ZT_NETWORK_ID }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          # build.sh generates a random root password when this is unset, and
          # then the only way to learn it is to publish it -- from a public
          # repository, where neither the log nor an artifact is private.
          # Supplying it as a secret is what keeps it out of both.
          if [ -z "$ROOT_PASSWORD" ]; then
            echo "Set the ROOT_PASSWORD repository secret before building."
            echo "Settings -> Secrets and variables -> Actions -> New secret."
            exit 1
          fi
          chmod +x ./build.sh
          ./build.sh --rpi-model ${{ env.RPI_MODEL }}

      # Find the generated image
      - name: Find Generated Image
        id: find_image
        run: |
          # Search in both current directory (new default) and /tmp (fallback)
          IMAGE_FILE=$(find . /tmp -maxdepth 2 -name "rpi-build.*" -type d -exec find {} -name "*.img.zst" \; 2>/dev/null | head -1)
          if [ -z "$IMAGE_FILE" ]; then
            echo "ERROR: No compressed image found!"
            echo "Searched in: $(pwd) and /tmp"
            ls -la $(pwd)/rpi-build.* 2>/dev/null || echo "No rpi-build dirs in $(pwd)"
            ls -la /tmp/rpi-build.* 2>/dev/null || echo "No rpi-build dirs in /tmp"
            exit 1
          fi
          echo "IMAGE_FILE=$IMAGE_FILE" >> $GITHUB_ENV
          echo "IMAGE_NAME=$(basename $IMAGE_FILE)" >> $GITHUB_ENV
          echo "Found image: $IMAGE_FILE"

          # The root password is not discovered, logged or uploaded any more.
          # It comes from the ROOT_PASSWORD secret, so it is already known to
          # whoever runs this and never has to leave the build.

      # Upload compressed image as artifact
      - name: Upload Compressed Image as Artifact
        if: always() && env.IMAGE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: ${{ env.IMAGE_FILE }}
          retention-days: 90
          compression-level: 0

      # Publish the image where it can be flashed without unwrapping it first.
      #
      # Every workflow artifact is served inside a zip GitHub adds itself, so
      # downloading one gives a zip of a .img.zst: two layers to strip before
      # any imager will look at it. A release asset is served as the file it
      # is, on a stable URL, so the image goes straight into Raspberry Pi
      # Imager (which reads zstd) or one `unzstd` away from anything else.
      #
      # The tag is rolling rather than per-commit: the useful question is
      # "what is the current image for this model", and /releases/latest/
      # answers it without looking anything up.
      #
      # The root password file is deliberately not published here. It is the
      # credential for the machine, and this release is as public as the repo.
      - name: Publish the image as a release asset
        if: env.IMAGE_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="rpi${RPI_MODEL}-latest"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" \
              --title "Arch Linux ARM for Raspberry Pi $RPI_MODEL" \
              --notes "Flash the .img.zst directly with Raspberry Pi Imager, or unzstd it first for imagers that do not read zstd. Root logs in over SSH by key on port 34522; the console password is the one set in the ROOT_PASSWORD secret. The root filesystem expands to fill the card on first boot."
          gh release upload "$tag" "$IMAGE_FILE" --clobber
          echo "Flashable image: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$IMAGE_NAME"

      # Upload to S3 (optional)
      - name: Upload Image to S3
        if: (vars.UPLOAD_TO_S3 == 'true' || inputs.upload_to_s3 == true) && env.IMAGE_FILE != ''
        run: |
          echo "Uploading to S3: $IMAGE_NAME"
          s3cmd \
            --access_key="${{ secrets.S3_ACCESS_KEY }}" \
            --secret_key="${{ secrets.S3_SECRET_KEY }}" \
            --host="${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --host-bucket="${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --region=auto \
            --progress \
            --stats \
            put "$IMAGE_FILE" s3://${{ vars.CF_BUCKET_NAME }}/

      # Print summary
      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Build Summary"
          echo "=========================================="
          echo "Raspberry Pi Model: ${{ env.RPI_MODEL }}"
          echo "Image Name: ${{ env.IMAGE_NAME }}"
          echo "Root Password: the ROOT_PASSWORD secret you set."
          echo "=========================================="

